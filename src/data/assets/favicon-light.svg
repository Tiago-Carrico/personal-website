<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3525cd" />
      <stop offset="100%" stop-color="#006a61" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="45" fill="rgba(255, 255, 255, 0.9)" stroke="url(#lightGrad)" stroke-width="4" filter="url(#softGlow)" />
  <text x="50" y="62" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="bold" fill="url(#lightGrad)" text-anchor="middle" filter="url(#softGlow)">&lt;/&gt;</text>
</svg>
