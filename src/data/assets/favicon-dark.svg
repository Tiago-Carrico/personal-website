<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="45" fill="rgba(19, 18, 28, 0.8)" stroke="url(#neonGrad)" stroke-width="4" filter="url(#glow)" />
  <text x="50" y="62" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="bold" fill="url(#neonGrad)" text-anchor="middle" filter="url(#glow)">&lt;/&gt;</text>
</svg>
